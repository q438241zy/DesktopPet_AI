name: Windows build and behavior
on: [push, pull_request]
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Verify core and real assets
        shell: pwsh
        run: ./tools/check.ps1
      - name: Build portable distribution
        shell: pwsh
        run: ./tools/publish.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: DesktopPet-win-x64
          path: Release/win-x64
