<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Claude · 原图对照</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fffafa;color:#634e57;font-family:system-ui,"Microsoft YaHei",sans-serif}main{max-width:1240px;margin:40px auto;padding:0 24px}a{color:#a45374;text-decoration:none}header{display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:26px;font-weight:600}p{font-size:13px;line-height:1.8;color:#8f7582}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:22px 0}article{background:white;border:1px solid #eedde5;border-radius:23px;overflow:hidden;padding:14px 0}article.candidate{border-color:#d697ae;background:#fff5f8}h2{font-size:14px;font-weight:500;text-align:center;margin:8px 0}canvas{display:block;width:100%;height:330px}article small{display:block;min-height:40px;text-align:center;font-size:11px;color:#a08794;padding:0 10px}.overlay{padding:20px;background:white;border:1px solid #eedde5;border-radius:23px;display:grid;grid-template-columns:minmax(250px,1fr) 1fr;align-items:center;gap:24px}.overlay canvas{height:350px}.overlay label{display:block;font-size:13px;line-height:2}input{width:100%;accent-color:#b77a91}button{border:1px solid #e2c8d4;background:#fff8fa;color:inherit;border-radius:18px;padding:10px 18px;cursor:pointer}#error{color:#af3556}@media(max-width:760px){main{margin:20px auto;padding:0 16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}canvas{height:280px}header{align-items:flex-start;flex-direction:column;gap:0}.overlay{grid-template-columns:1fr;gap:6px}h1{font-size:23px}}
</style></head><body><main>
<header><div><h1>Claude · 原图对照</h1><p>眼镜、花饰、发型与短袖短裤，放在一起看。</p></div><a href="index.html?review=chat-v15">返回云朵伙伴 →</a></header>
<div class="grid">
<article><h2>原装站姿</h2><canvas id="original"></canvas><small>原有正面参考</small></article>
<article><h2>旧运动服站姿</h2><canvas id="previous"></canvas><small>v1.4 取自侧身走路帧</small></article>
<article class="candidate"><h2>修订正面站姿</h2><canvas id="candidate"></canvas><small>已批准 · v1.8 接入</small></article>
<article><h2>运动服坐姿</h2><canvas id="seated"></canvas><small>原有坐姿保留</small></article>
</div>
<section class="overlay"><canvas id="overlay" aria-label="原图与新站姿叠图"></canvas><div><h2 style="text-align:left">原图 / 新站姿</h2><p>各使用固定的整图等比缩放和共同脚底基线。滑动查看脸型、发饰与身体轮廓；没有拉伸身体或单独缩放四肢。</p><label>新站姿透明度 <output id="amount">50%</output><input id="opacity" type="range" min="0" max="100" value="50"></label><button id="toggle" type="button">原图 / 新图切换</button><p>这是画稿审阅页。日常程序仍为 v1.4。</p></div></section><p id="error" role="status"></p>
<script src="../sprite-cells.js"></script><script src="data.js"></script><script src="preview-art.js"></script><script>
const looks=CLOUD_DATA.families.claude.styles.chibi.looks,descs={original:looks.original.stand,previous:ClaudeIdleReview.previous,candidate:ClaudeIdleReview.candidate,seated:looks.sports.sit},images=new Map();
function url(d){return new URL(d.demoFile||CLOUD_DATA.assetRoot+'claude/'+d.file,location.href).href;}
async function load(d){const src=url(d);if(images.has(src))return;const img=new Image();images.set(src,img);await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=src;});}
function surface(id){const c=document.getElementById(id),r=c.getBoundingClientRect(),dpr=Math.min(3,devicePixelRatio||1);c.width=Math.round(r.width*dpr);c.height=Math.round(r.height*dpr);return c;}
function sprite(ctx,desc,w,h,opacity=1){const c=desc.cells[desc.frames[0]],img=images.get(url(desc));if(!img?.complete)return;const factor=Math.min(h*.70,w*.82)/desc.reference*c.scale,isolated=SpriteCells.crop(img,[c.x,c.y,c.width,c.height],c.ownership);ctx.save();ctx.globalAlpha=opacity;ctx.drawImage(isolated||img,...(isolated?[0,0,c.width,c.height]:[c.x,c.y,c.width,c.height]),w/2-c.footX*factor,h*.93-c.footY*factor,c.width*factor,c.height*factor);ctx.restore();}
function draw(){for(const [id,desc] of Object.entries(descs)){const c=surface(id),ctx=c.getContext('2d');sprite(ctx,desc,c.width,c.height);}const c=surface('overlay'),ctx=c.getContext('2d'),alpha=Number(document.getElementById('opacity').value)/100;sprite(ctx,descs.original,c.width,c.height,1-alpha);sprite(ctx,descs.candidate,c.width,c.height,alpha);document.getElementById('amount').textContent=Math.round(alpha*100)+'%';}
document.getElementById('opacity').oninput=draw;document.getElementById('toggle').onclick=()=>{const slider=document.getElementById('opacity');slider.value=slider.value==='100'?'0':'100';draw();};window.addEventListener('resize',draw);Promise.all(Object.values(descs).map(load)).then(draw).catch(()=>document.getElementById('error').textContent='画稿读取失败，请从 D 盘完整 Demo 目录打开。');
</script></main></body></html>
