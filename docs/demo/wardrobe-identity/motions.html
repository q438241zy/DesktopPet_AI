<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>运动服 · 动作复核</title><link rel="stylesheet" href="style.css"><style>
main{max-width:1280px}.review-tools{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:18px 0}.review-tools select{max-width:340px;padding:9px;border:1px solid #edd9e1;border-radius:12px;background:#fff;color:inherit}.motion-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.pair{background:#fff;border:1px solid #eadde5;border-radius:20px;padding:10px}.pair canvas{width:100%;height:auto;display:block}.pair p{margin:4px;font-size:12px;text-align:center}.dark .pair{background:#242c3d;color:#eee}#status{white-space:pre-line}#player{width:100%;max-height:550px;background:white;border:1px solid #eadde5;border-radius:24px}#audit-summary{padding:12px 0}.muted{color:#947f8c}button:disabled{opacity:.5}.split-labels{display:flex;justify-content:space-around}#error{color:#ad305c}@media(max-width:850px){.motion-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:540px){.motion-grid{grid-template-columns:1fr}}
</style><script src="motion-data.js" defer></script><script src="motions.js" defer></script></head><body><main>
<header><a class="back" href="index.html">← 换装对照</a><span>运动服动作复核</span></header><h1>同一角色，同一动作</h1>
<div class="review-tools"><label>图组 <select id="sheet"></select></label><label>动作 <select id="clip"></select></label><button id="play" class="soft">播放</button><button id="prev" class="soft" aria-label="上一帧">←</button><input id="frame" type="range" min="0" value="0" aria-label="动作帧"><button id="next" class="soft" aria-label="下一帧">→</button><output id="counter"></output><label><input id="overlay" type="checkbox">叠图</label><label><input id="dark" type="checkbox">深色背景</label></div>
<p id="status" role="status"></p><p id="error" role="alert" hidden></p><div class="split-labels"><span id="reference-label">原图</span><span>运动服</span></div><canvas id="player" width="1100" height="480" aria-label="原图和运动服同步播放"></canvas>
<p class="muted">原图与换衣稿使用相同等比缩放。坐下、弯腿或举手时不单独缩放人物。</p><details><summary>查看完整图集</summary><canvas id="atlas" style="width:100%;height:auto" aria-label="完整原图与运动服图集"></canvas></details><div id="grid" class="motion-grid"></div><p id="audit-summary"></p>
</main></body></html>
